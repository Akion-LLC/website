[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options        = "DENY"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Limit referrer information to origin only
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # Enforce HTTPS for 1 year, including subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Restrict browser feature APIs not needed by this site
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # CSP: restrict load origins; unsafe-inline required for inline <style> and <script> blocks
    # font-src allows Google Fonts; no external scripts permitted
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
